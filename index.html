}

html[data-theme="dark"]{

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0; min-height:100dvh; background:var(--bg); color:var(--ink);

}
.wrap{max-width:620px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; touch-action:manipulation}
input,select{font:inherit}

/* ---------- 顶部卡片 ---------- */
.hero{background:linear-gradient(135deg,#2f5fe8,#6a3ff2 60%,#8a3ff2); color:#fff; border-radius:20px; padding:18px 18px 16px; box-shadow:0 8px 24px rgba(47,95,232,.28); margin-bottom:12px}
.hero .lab{font-size:13px; opacity:.85; letter-spacing:.5px}
.hero .big{font-size:46px; font-weight:800; line-height:1.15; margin:2px 0 0}
.hero .big small{font-size:17px; font-weight:600; opacity:.9; margin-left:4px}
.hero .sub{font-size:12.5px; opacity:.85; margin-top:6px}
.hero .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.hchip{font-size:12px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.28); padding:4px 10px; border-radius:999px; backdrop-filter:blur(4px)}

/* ---------- 统计条 ---------- */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; box-shadow:var(--shadow)}
.stat .k{font-size:11.5px; color:var(--mut)}
.stat .v{font-size:17px; font-weight:700; margin-top:2px; color:var(--acc)}
.stat .v.small{font-size:14px}

/* ---------- 卡片与通用 ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:6px 14px; box-shadow:var(--shadow); margin-bottom:12px}
.card>.head{display:flex; align-items:center; gap:8px; padding:11px 0; font-weight:700}
.badge{font-size:11px; font-weight:600; padding:2.5px 8px; border-radius:999px; white-space:nowrap}
.b-task{background:var(--acc2); color:var(--acc)}
.b-flex{background:var(--amber2); color:var(--amber)}
.b-buffer{background:var(--green2); color:var(--green)}
.b-exam{background:var(--red2); color:var(--red)}
.b-fest{background:var(--amber2); color:var(--amber)}
.b-dUT{background:transparent; color:var(--red); border:1px solid var(--red)}
.mut{color:var(--mut); font-weight:400}
.note{font-size:12.5px; color:var(--mut); padding:0 0 10px}
.progress{height:8px; border-radius:99px; background:var(--line); overflow:hidden}
.progress i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#2f5fe8,#8a3ff2)}
.progress .p-label{display:flex; justify-content:space-between; font-size:12px; color:var(--mut); margin-top:6px}

/* ---------- 任务条目 ---------- */
.item{display:flex; align-items:flex-start; gap:11px; padding:11px 0; border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.chk{flex:0 0 auto; width:26px; height:26px; margin-top:2px; border-radius:50%; border:2px solid var(--mut); opacity:.55; display:flex; align-items:center; justify-content:center; font-size:15px; color:#fff; transition:all .15s}
.item.done .chk{background:var(--acc); border-color:var(--acc); opacity:1}
.item.opt .chk{border-style:dashed}
.ibody{flex:1; min-width:0}
.t1{display:flex; align-items:baseline; gap:8px}
.num{flex:0 0 auto; font-size:11.5px; font-weight:700; color:var(--acc); background:var(--acc2); border-radius:6px; padding:1px 6px}
.chip{flex:0 0 auto; font-size:11px; font-weight:600; border-radius:6px; padding:1.5px 7px}
.chip.计价{background:var(--acc2); color:var(--acc)}
.chip.案例{background:var(--green2); color:var(--green)}
.chip.通用{background:var(--purple2); color:var(--purple)}
.title{font-size:15px; font-weight:600; word-break:break-all}
.item.done .title{text-decoration:line-through; opacity:.5}
.t2{font-size:12px; color:var(--mut); margin-top:2px}
.dur{flex:0 0 auto; font-size:12.5px; font-weight:700; color:var(--mut); margin-top:4px; font-variant-numeric:tabular-nums}
.item.opt .title{font-weight:500; color:var(--mut)}
.item.opt .dur::after{content:" ·可选"; color:var(--amber); font-size:11px}
.item.info{align-items:center}
.item.info .ibody .title{font-weight:700; color:var(--red)}
.doneBox{border-top:1px dashed var(--line); margin-top:2px; padding:9px 2px 7px; font-size:13px; color:var(--mut); text-align:center}
.missed{background:var(--amber2); color:var(--amber); border-radius:14px; padding:11px 14px; font-size:13.5px; font-weight:600; margin-bottom:12px}
.resched{background:var(--acc2); color:var(--acc); border-radius:14px; padding:11px 14px; font-size:13.5px; font-weight:600; margin-bottom:12px}
.gap{background:var(--red2); color:var(--red); border-radius:14px; padding:11px 14px; font-size:13.5px; font-weight:600; margin-bottom:12px}
.gap b, .resched b{font-weight:800}

/* ---------- 计划页 ---------- */
.seg{display:flex; background:var(--line); border-radius:12px; padding:3px; margin-bottom:12px}
.seg button{flex:1; padding:7px 0; border-radius:9px; font-size:13.5px; font-weight:600; color:var(--mut)}
.seg button.on{background:var(--card); color:var(--acc); box-shadow:var(--shadow)}
.groupLab{font-size:13px; font-weight:700; color:var(--mut); margin:16px 2px 8px}
.dayHead{flex:1; min-width:0}
.dayHead .d1{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.dayHead .d2{font-size:12px; color:var(--mut); font-weight:400; margin-top:1px}
.caret{flex:0 0 auto; color:var(--mut); transition:transform .2s; font-size:13px}
.card.open .caret{transform:rotate(90deg)}
.dayBody{display:none; border-top:1px solid var(--line)}
.card.open .dayBody{display:block}
.msCard .head{display:block}
.msCard .due{font-size:12px; color:var(--mut); margin-top:2px; font-weight:400}
.msCard .chkBig{display:flex; align-items:flex-start; gap:11px}
.msCard .st{margin-left:auto; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px}
.st-ok{background:var(--green2); color:var(--green)}
.st-due{background:var(--red2); color:var(--red)}
.st-wait{background:var(--line); color:var(--mut)}
.gear{flex:0 0 auto; min-width:30px; height:30px; padding:0 8px; border-radius:8px; background:var(--acc2); color:var(--acc); display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; white-space:nowrap}
.idleNote{font-size:12.5px; color:var(--mut); padding:10px 2px}

/* ---------- 设置页 ---------- */
.setRow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 2px; border-top:1px solid var(--line)}
.setRow:first-child{border-top:0}
.setRow .k{font-weight:600; font-size:15px}
.setRow .d{font-size:12px; color:var(--mut); margin-top:1px}
.miniSeg{display:flex; background:var(--line); border-radius:10px; padding:2.5px; flex:0 0 auto}
.miniSeg button{padding:5.5px 13px; border-radius:8px; font-size:13px; font-weight:600; color:var(--mut); white-space:nowrap}
.miniSeg button.on{background:var(--card); color:var(--acc); box-shadow:var(--shadow)}
input[type=date]{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:7px 10px; font-size:15px; min-height:44px}
.btn{display:block; width:100%; text-align:center; padding:11px; border-radius:12px; background:var(--acc2); color:var(--acc); font-weight:700; font-size:14.5px; margin-top:9px; min-height:44px}
.btn.danger{background:var(--red2); color:var(--red)}
.about{font-size:12px; color:var(--mut); text-align:center; padding:14px 0 4px}

/* ---------- 底部导航 ---------- */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:50; display:grid; grid-template-columns:repeat(3,1fr);
  background:color-mix(in srgb, var(--card) 86%, transparent); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);

.tabbar button{display:flex; flex-direction:column; align-items:center; gap:1px; padding:5px 0; color:var(--mut); font-size:11px; font-weight:600}
.tabbar button .ico{font-size:21px; line-height:1.2}
.tabbar button.on{color:var(--acc)}

/* ---------- 调整弹层 ---------- */
.modalWrap{position:fixed; inset:0; z-index:120; background:rgba(8,12,24,.55); display:flex; align-items:flex-end; justify-content:center}
.modal{background:var(--card); width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:18px 18px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -8px 30px rgba(0,0,0,.25)}

.mSub{font-size:12.5px; color:var(--mut); margin:4px 0 12px}
.capChips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.capChips button{padding:9px 14px; border-radius:10px; background:var(--line); font-weight:700; font-size:13.5px; color:var(--ink)}
.capChips button.on{background:var(--acc); color:#fff}
.capCustom{display:flex; gap:8px; align-items:center; margin-bottom:4px}
.capCustom input{width:100px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:8px; font-size:15px}
.capCustom .lab{font-size:12.5px; color:var(--mut)}
.mBtns{display:flex; gap:10px; margin-top:14px}
.mBtns .btn{margin-top:0}
body.modalOpen{overflow:hidden}
</style>
</head>

const todayISO = () => iso(new Date());
const parseD = s => { const [y,m,dd] = s.split('-').map(Number); return new Date(y, m-1, dd); };
const dayDiff = (a,b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const WD = ['日','一','二','三','四','五','六'];

const specialOf = date => D.special[date] || null;

const effMin = sec => Math.round(sec / 60 / state.speed);
const fmtDur = min => { if(min < 1) return '0分'; const h = Math.floor(min/60), m = min % 60; return (h ? h+'小时' : '') + (m ? m+'分' : ''); };
const fmtClock = s => Math.floor(s/3600) + ':' + pad2(Math.floor(s%3600/60)) + ':' + pad2(s%60);

/* ---------- 任务与容量模型 ---------- */
// 某天“原始安排”的任务（含考试信息行）
function itemsOfDay(date){
  const day = D.daysP1.find(x => x.date === date);
  const out = [];
  if(day) for(const n of day.lessons){
    const l = LM.get(n);
    out.push({id:'v'+pad2(n), date:date, min:effMin(l.sec), video:true, title:l.title, num:pad2(n), sec:l.sec, pdf:l.pdf, optional:false});
  }
  const p2 = P2MAP.get(date);
  if(p2) p2.items.forEach((it,i) => out.push({id:'p2-'+date+'-'+i, date:date, min:it.min, video:false, title:it.title, sub:it.subject, optional:!!it.optional, info:(it.min===0 && !it.optional)}));
  return out;
}
function itemsOfRange(a,b){
  const out = [];
  const d = parseD(a);
  while(iso(d) <= b){ out.push(...itemsOfDay(iso(d))); d.setDate(d.getDate()+1); }
  return out;
}
function timedItems(){
  return itemsOfRange(D.config.planStart, exam2ISO()).filter(x => !x.info);
}
// 默认容量 = 该天原始必做负载；空白的缓冲/机动日给固定容量
function defaultCap(date){
  const load = itemsOfDay(date).filter(t => !t.optional && !t.info).reduce((s,t)=>s+t.min,0);
  if(load > 0) return load;
  const sp = specialOf(date) || '';
  if(sp.includes('缓冲')) return 180;
  if(sp.includes('机动')) return 120;
  return 0;
}
const capOf = date => (state.caps && state.caps[date] !== undefined) ? state.caps[date] : defaultCap(date);

// 全部未完成任务，按原计划日期排序（顺序即优先级）
function taskQueue(){
  return timedItems()
    .filter(t => !state.checked[t.id])
    .map(t => Object.assign({}, t, {capMin: t.optional ? 0 : t.min}))
    .sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
}
// 从今天起按容量贪心填充；塞不下的计入缺口
function buildSchedule(){
  const t = todayISO(), end = exam2ISO();
  const queue = taskQueue();
  const sched = {}; let gi = 0, overflow = 0;
  const d = parseD(t);
  while(iso(d) <= end){
    const date = iso(d);
    let cap = capOf(date), used = 0; const arr = [];
    while(gi < queue.length){
      const task = queue[gi];
      if(task.capMin === 0 || task.capMin <= cap - used){ arr.push(task); used += task.capMin; gi++; } else break;
    }
    sched[date] = {tasks:arr, used, cap};
    d.setDate(d.getDate()+1);
  }
  const rest = queue.slice(gi);
  overflow = rest.filter(x => x.capMin > 0).reduce((s,x)=>s+x.capMin,0);
  return {sched, overflow, rescheduled: queue.filter(x => x.date < t).length};
}

function badgesFor(date, includeType){
  const badges = [];
  const ph = phaseOf(date);
  if(ph && includeType && ['flexible','buffer','exam'].includes(ph.type)){
    const nmap = {flexible:'弹性日', buffer:'机动日', exam:'考试日'};
    const bmap = {flexible:'b-flex', buffer:'b-buffer', exam:'b-exam'};
    badges.push(`<span class="badge ${bmap[ph.type]}">${nmap[ph.type]}</span>`);
  }
  const sp = specialOf(date);
  if(sp && sp !== '考试日') badges.push(`<span class="badge ${sp==='调休上班'?'b-dUT':(sp.includes('缓冲')?'b-buffer':'b-fest')}">${sp}</span>`);
  return badges.join('');
}
function dayCard(date, tasks, opts={}){
  const t = todayISO();
  const timed = tasks.filter(r => !r.info);
  const doneN = timed.filter(r => state.checked[r.id]).length;
  const open = expanded.has(date) || (opts.autoOpen && date === t);
  const meta = opts.meta || '';
  const gear = (date >= t && date <= exam2ISO()) ? `<button class="gear" data-gear="${date}">调</button>` : '';
  const body = tasks.length
    ? tasks.map(x => rowFor(x, date)).join('')
    : `<div class="idleNote">${opts.idleNote || '当天无安排'}</div>`;
  return `<div class="card daycard${open?' open':''}" data-date="${date}">
    <div class="head dayHeadBtn" data-date="${date}">
      <span class="caret">▶</span>
      <div class="dayHead">
        <div class="d1"><span>${fmtDate(date)} ${wdCN(date)}</span>${badgesFor(date, true)}</div>
        <div class="d2">${meta}</div>
      </div>
      ${gear}
      <span class="mut" style="font-size:12.5px;white-space:nowrap;margin-left:2px">${timed.length?doneN+'/'+timed.length:''}</span>
    </div>
    <div class="dayBody">${body}</div>
  </div>`;
}

}

      ? `<div class="idleNote">今天已顺延：任务已自动排入之后的日子。点右上角「已顺延·恢复」可撤销。</div>`
      : tasks.map(x => rowFor(x, t)).join('')}
    ${infoRows.map(x => rowFor(x, t)).join('')}
    ${done.length && !cap0 ? `<div class="doneBox">已完成 ${done.length} 项，继续加油 💪</div>` : ''}
  </div>`;
  $('#app').innerHTML = html;
}

function renderPlan(){
  if(!planSub) planSub = 'sched';
  const t = todayISO(), end = exam2ISO();
  const all = timedItems();
  const doneN = all.filter(x => state.checked[x.id]).length;
  const remain = all.filter(x => !state.checked[x.id] && !x.optional).reduce((s,x)=>s+x.min,0);
  const total = all.filter(x => !x.optional).reduce((s,x)=>s+x.min,0);
  const pct = total ? Math.round((1-remain/total)*100) : 0;
  const S = buildSchedule();

  let html = `<div class="card"><div class="progress"><i style="width:${pct}%"></i></div>
    <div class="p-label"><span>总进度 ${pct}% · 已看 ≈${fmtDur(all.filter(x=>state.checked[x.id]).reduce((s,x)=>s+x.min,0))}</span><span>剩余 ≈${fmtDur(remain)}（视频+任务）</span></div>
  </div>`;
  html += `<div class="seg">
    <button data-sub="sched" class="${planSub==='sched'?'on':''}">📅 日程</button>
    <button data-sub="ms" class="${planSub==='ms'?'on':''}">🏁 里程碑</button>
  </div>`;

  if(planSub === 'sched'){
    let capSum = 0; const d0 = parseD(t);
    while(iso(d0) <= end){ capSum += capOf(iso(d0)); d0.setDate(d0.getDate()+1); }
    const gap = Math.max(0, remain - capSum);
    const hasOverrides = Object.keys(state.caps || {}).length > 0;
    html += `<div class="card"><div class="head" style="padding-bottom:4px">考前健康度
      ${gap>0 ? '<span class="badge b-exam">缺口 '+fmtDur(gap)+'</span>' : (hasOverrides ? '<span class="badge b-task">已重排</span>' : '<span class="badge b-buffer">节奏正常</span>')}
    </div>
    <div class="note" style="padding:0 0 8px">剩余任务（视频＋刷题冲刺）≈${fmtDur(remain)} ÷ 剩余容量 ≈${fmtDur(capSum)}（今天→考试）${gap>0 ? '，<b style="color:var(--red)">考前还缺 '+fmtDur(gap)+'</b>' : (hasOverrides ? '，重排后仍可完成 ✅' : '')}</div>
    ${hasOverrides ? '<button class="btn" id="btnRestorePlan">↺ 恢复官方计划（清除全部调整）</button>' : ''}
    </div>`;

    let curPhase = null;
    const d = parseD(D.config.planStart);
    while(iso(d) <= end){
      const date = iso(d);
      const ph = phaseOf(date);
      if(ph && ph.key !== curPhase){
        curPhase = ph.key;
        html += `<div class="groupLab">${esc(ph.name)} ${fmtDate(ph.start)}–${fmtDate(ph.end)} · ${esc(ph.desc)}</div>`;
      }
      if(date < t){
        const rows = itemsOfDay(date);
        const sum = rows.filter(x=>!x.info).reduce((s,x)=>s+x.min,0);
        const dayObj = D.daysP1.find(x=>x.date===date);
        html += dayCard(date, rows, {meta:(rows.length?rows.length+'节 · ':'')+'≈'+fmtDur(sum)+((dayObj&&dayObj.note)?' · '+esc(dayObj.note):''), autoOpen:false});
      } else {
        const slot = S.sched[date] || {tasks:[]};
        const tasks = slot.tasks;
        const load = tasks.filter(x=>!x.optional&&!x.info).reduce((s,x)=>s+x.min,0);
        let meta = (date === t ? '今天 · ' : '') + (tasks.length ? tasks.length+'项 · 负载≈'+fmtDur(load)+' · ' : '') + capLabel(date);
        let idleNote = null;
        if(!tasks.length){
          if(capOf(date) === 0) idleNote = '休息日 / 已清空：任务已顺延至之后';
          else idleNote = '富余 '+fmtDur(capOf(date))+'：可主动加练或提前';
        }
        html += dayCard(date, tasks, {meta, autoOpen:true, idleNote});
      }
      d.setDate(d.getDate()+1);
    }
  } else {
    const t2 = todayISO();
    const msDone = D.milestones.filter(m => state.checked[m.id]).length;
    html += `<div class="groupLab">套卷里程碑（进度 ${msDone}/4）——只考核节点，不排死每天</div>`;
    for(const m of D.milestones){
      const done = !!state.checked[m.id];
      const dd = dayDiff(t2, m.due);
      let st, cls;
      if(done){ st='已完成'; cls='st-ok'; }
      else if(dd < 0){ st='已过期 '+fmtDate(m.due); cls='st-due'; }
      else if(dd === 0){ st='今天截止'; cls='st-due'; }
      else { st='截止 '+fmtDate(m.due)+' · 还有'+dd+'天'; cls='st-wait'; }
      html += `<div class="card msCard"><div class="head"><div class="chkBig">
        <button class="chk" data-id="${m.id}" style="${done?'background:var(--acc);border-color:var(--acc);opacity:1':''}">${done?'✓':''}</button>
        <div class="ibody"><div class="t1"><span class="title">${esc(m.title)}</span></div>
        <div class="due">📌 ${esc(m.due)} ${wdCN(m.due)}</div></div>
        <span class="st ${cls}">${st}</span>
      </div></div></div>`;
    }
    html += `<div class="card"><div class="note" style="padding:10px 0 2px">💡 里程碑制：到截止日完成即可，哪天做、哪天歇自己定。落后先吃机动日(10/9)和假期加练，不动冲刺周。</div></div>`;
  }
  $('#app').innerHTML = html;
}

function renderSet(){
  $('#app').innerHTML = `
  <div class="card">
    <div class="setRow"><div><div class="k">考试日期（倒计时目标）</div><div class="d">默认 ${D.config.examDate}《${D.config.examSubject1}》，次日考案例</div></div>
      <input type="date" id="examDate" value="${state.examDate}"></div>
    <div class="setRow"><div><div class="k">视频倍速</div><div class="d">当前按 ${state.speed}x 折算观看时长，改动后全站重算</div></div>
      <div class="miniSeg" id="speedSeg">${[1,1.2,1.5].map(v=>`<button data-v="${v}" class="${state.speed===v?'on':''}">${v}x</button>`).join('')}</div></div>
    <div class="setRow"><div><div class="k">外观</div><div class="d">深色模式跟随系统，或手动指定</div></div>
      <div class="miniSeg" id="themeSeg">${[['auto','自动'],['light','浅色'],['dark','深色']].map(([v,n])=>`<button data-v="${v}" class="${state.theme===v?'on':''}">${n}</button>`).join('')}</div></div>
  </div>
  <div class="card">
    <div class="setRow"><div><div class="k">动态调整</div><div class="d">在「计划 · 日程」里点某天的「调」改容量/清空；今日页可一键顺延</div></div></div>
    <button class="btn" id="btnRestorePlan2">↺ 恢复官方计划（清除全部容量调整）</button>
  </div>
  <div class="card">
    <div class="setRow"><div><div class="k">数据备份</div><div class="d">勾选与调整仅存本机浏览器，建议定期导出</div></div></div>
    <button class="btn" id="btnExport">导出（复制到剪贴板）</button>
    <button class="btn" id="btnImport">导入（粘贴备份）</button>
    <button class="btn danger" id="btnReset">清空勾选与调整</button>
  </div>
  <div class="about">一造备考工作台 · 数据 100% 本地存储，不上传任何服务器<br>共 ${D.lessons.length} 节课 · 原速 ${fmtClock(D.config.videoTotalSec)} · 距考试见首页</div>`;
}

function applyTheme(){ document.documentElement.dataset.theme = state.theme; }
function render(){
  applyTheme();
  if(tab === 'today') renderToday();
  else if(tab === 'plan') renderPlan();
  else renderSet();
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
}

function toggle(id){
  if(state.checked[id]) delete state.checked[id];
  else state.checked[id] = todayISO();
  persist();
  render();
}

/* ---------- 容量调整弹层 ---------- */
const CAP_PRESETS = [['def','默认'],['0','清零'],['30','30分'],['60','1h'],['120','2h'],['180','3h'],['240','4h']];
function openDayCfg(date){
  modalDate = date;
  modalSel = (state.caps[date] !== undefined) ? String(state.caps[date]) : 'def';
  renderModal();
  document.body.classList.add('modalOpen');
}
function renderModal(){
  const date = modalDate;
  const load = itemsOfDay(date).filter(x=>!x.optional&&!x.info).reduce((s,x)=>s+x.min,0);
  const chips = CAP_PRESETS.map(([v,n]) => `<button data-v="${v}" class="${modalSel===v?'on':''}">${n}</button>`).join('');
  let overlay = document.getElementById('modalWrap');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'modalWrap'; overlay.className = 'modalWrap';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `<div class="modal">
    <div class="mTitle">${fmtDate(date)} ${wdCN(date)} · 调整这一天</div>
    <div class="mSub">原定负载 ≈${fmtDur(load)}。清零 = 这天空（任务自动顺延）；调大 = 多扛一些。保存后从今天起自动重排。</div>
    <div class="capChips">${chips}</div>
    <div class="capCustom"><input id="capInput" type="number" min="0" max="720" step="15" placeholder="自定义"><span class="lab">分钟（保存前输入生效）</span></div>
    <div class="mBtns">
      <button class="btn" id="capApply">保存</button>
      <button class="btn" id="capDef" style="background:var(--line);color:var(--mut)">恢复默认</button>
      <button class="btn danger" id="capClose">关闭</button>
    </div>
  </div>`;
}
function closeDayCfg(){
  const o = document.getElementById('modalWrap'); if(o) o.remove();
  document.body.classList.remove('modalOpen');
  modalDate = null; render();
}
function applyDayCfg(){
  if(!state.caps) state.caps = {};
  if(modalSel === 'def') delete state.caps[modalDate];
  else state.caps[modalDate] = parseInt(modalSel,10) || 0;
  persist();
  closeDayCfg();
}
function fallbackCopy(txt){
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); alert('已复制到剪贴板'); }catch(e){ alert('复制失败，请手动记录'); }
  ta.remove();
}

document.addEventListener('click', e => {
  const chk = e.target.closest('.chk');
  if(chk && chk.dataset.id){ toggle(chk.dataset.id); return; }
  const gearBtn = e.target.closest('[data-gear]');
  if(gearBtn){ openDayCfg(gearBtn.dataset.gear); return; }
  const dh = e.target.closest('.dayHeadBtn');
  if(dh){ const d = dh.dataset.date; expanded.has(d) ? expanded.delete(d) : expanded.add(d); render(); return; }
  const st = e.target.closest('#tabbar button');
  if(st){ tab = st.dataset.tab; window.scrollTo(0,0); render(); return; }
  const sg = e.target.closest('.seg button');
  if(sg){ planSub = sg.dataset.sub; render(); return; }
  const spd = e.target.closest('#speedSeg button');
  if(spd){ state.speed = parseFloat(spd.dataset.v); persist(); render(); return; }
  const th = e.target.closest('#themeSeg button');
  if(th){ state.theme = th.dataset.v; persist(); render(); return; }
  if(e.target.id === 'btnSkipToday'){
    const t = todayISO();
    if(capOf(t) === 0) delete state.caps[t]; else state.caps[t] = 0;
    persist(); render(); return;
  }
  if(e.target.id === 'btnRestorePlan' || e.target.id === 'btnRestorePlan2'){
    if(confirm('清除所有容量调整，恢复官方计划？')){ state.caps = {}; persist(); render(); }
    return;
  }
  const cc = e.target.closest('.capChips button');
  if(cc){ modalSel = cc.dataset.v; renderModal(); return; }
  if(e.target.id === 'capApply'){
    const inp = document.getElementById('capInput');
    if(inp && inp.value !== '' && modalSel !== 'def'){ modalSel = String(parseInt(inp.value,10) || 0); }
    applyDayCfg(); return;
  }
  if(e.target.id === 'capDef'){ if(modalDate){ delete state.caps[modalDate]; persist(); } closeDayCfg(); return; }
  if(e.target.id === 'capClose'){ closeDayCfg(); return; }
  if(e.target.id === 'modalWrap'){ closeDayCfg(); return; }
  if(e.target.id === 'btnExport'){
    const txt = JSON.stringify({v:2, exportedAt:todayISO(), checked:state.checked, caps:state.caps});
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>alert('已复制到剪贴板，粘贴保存即可'), ()=>fallbackCopy(txt));
    else fallbackCopy(txt);
  }
  if(e.target.id === 'btnImport'){
    const txt = prompt('粘贴备份内容（JSON）：');
    if(!txt) return;
    try{
      const obj = JSON.parse(txt);
      if(!obj.checked) throw 0;
      state.checked = obj.checked; state.caps = obj.caps || {}; persist(); render(); alert('导入成功：已恢复 '+Object.keys(obj.checked).length+' 条记录');
    }catch(err){ alert('导入失败：内容不是有效备份'); }
  }
  if(e.target.id === 'btnReset'){
    if(confirm('确定清空全部勾选与调整记录？此操作不可恢复')){ state.checked = {}; state.caps = {}; persist(); render(); }
  }
});
document.addEventListener('change', e => {
  if(e.target.id === 'examDate' && e.target.value){ state.examDate = e.target.value; persist(); render(); }
});
setInterval(() => { const t = todayISO(); if(t !== lastDate){ lastDate = t; render(); } }, 60000);

// 离线缓存：托管在 https 下时注册 Service Worker，首次访问后即可断网使用
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// —— 题库工作台联动：统计今日刷题数 ——
(function(){
  try {
    const t = todayISO();
    let n = 0, ok = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf('jk_rec_') === 0) {
        const recs = JSON.parse(localStorage.getItem(k) || '{}');
        for (const id in recs) {
          const r = recs[id];
          if (r && r.t) {
            const d = new Date(r.t);
            const ds = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
            if (ds === t) { n++; if (r.ok) ok++; }
          }
        }
      }
    }
    const el = document.getElementById('qbBridge');
    if (el) el.textContent = '📝 今日题库已刷 ' + n + ' 题 · 答对 ' + ok + ' （点击返回刷题）';
  } catch(e) {}
})();
render();
setTimeout(function(){ try { const el = document.getElementById('qbBridge'); if (el && el.textContent.indexOf('已刷') < 0) { const ev = new Event('qbrefresh'); document.dispatchEvent(ev); } } catch(e) {} }, 600);
document.addEventListener('qbrefresh', function() { try { (function(){ const t = todayISO(); let n = 0, ok = 0; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf('jk_rec_') === 0) { const recs = JSON.parse(localStorage.getItem(k) || '{}'); for (const id in recs) { const r = recs[id]; if (r && r.t) { const d = new Date(r.t); const ds = d.getFullYear()+ '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); if (ds === t) { n++; if (r.ok) ok++; } } } } } const el = document.getElementById('qbBridge'); if (el) el.textContent = '📝 今日题库已刷 ' + n + ' 题 · 答对 ' + ok + ' （点击返回刷题）'; })(); } catch(e) {} });
</script>
</body>
</html>
